# ============================================================
# Microservice Deployment Template
# Each service gets a Deployment + ClusterIP Service
# ============================================================

# --- Auth Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nsip
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: nsip/auth-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nsip-config
            - secretRef:
                name: nsip-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nsip
spec:
  selector:
    app: auth-service
  ports:
    - port: 8080
      targetPort: 8080

