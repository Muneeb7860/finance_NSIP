name: NSIP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/nsip

jobs:
  # ============================================================
  # Stage 1: Build & Test all Java Microservices
  # ============================================================
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - claim-service
          - contribution-service
          - education-service
          - event-service
          - rewards-service
          - saga-orchestrator
          - payment-service
          - review-service
          - notification-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build & Test ${{ matrix.service }}
        run: |
          cd backend/${{ matrix.service }}
          ./mvnw clean verify

  # ============================================================
  # Stage 2: Build & Test React Web App
  # ============================================================
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install & Build React
        run: |
          cd frontend-web
          npm ci
          npm run build

  # ============================================================
  # Stage 3: Build & Test Flutter Mobile App
  # ============================================================
  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'

      - name: Flutter Analyze & Test
        run: |
          cd frontend-mobile
          flutter pub get
          flutter analyze
          flutter test

  # ============================================================
  # Stage 4: Docker Build & Push (only on main branch)
  # ============================================================
  docker-publish:
    needs: [build-backend, build-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - claim-service
          - contribution-service
          - education-service
          - event-service
          - rewards-service
          - saga-orchestrator
          - payment-service
          - review-service
          - notification-engine
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

  # ============================================================
  # Stage 5: Deploy to Kubernetes (only on main branch)
  # ============================================================
  deploy-k8s:
    needs: [docker-publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set K8s Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy Infrastructure
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/config.yaml
          kubectl apply -f k8s/infra.yaml

      - name: Deploy Microservices
        run: |
          kubectl apply -f k8s/services.yaml

      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml

      - name: Rolling Restart (pick up new images)
        run: |
          for svc in auth-service claim-service contribution-service education-service event-service rewards-service saga-orchestrator payment-service review-service notification-engine; do
            kubectl rollout restart deployment/$svc -n nsip
          done

      - name: Verify Deployments
        run: |
          kubectl get pods -n nsip
          kubectl get svc -n nsip
