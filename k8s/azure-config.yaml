apiVersion: v1
kind: ConfigMap
metadata:
  name: nsip-azure-config
  namespace: nsip
data:
  # --- Azure Database for PostgreSQL ---
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_ORG_HIBERNATE: INFO
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_DATASOURCE_URL: "jdbc:postgresql://nsip-postgres-v4.postgres.database.azure.com:5432/nsip_db?sslmode=require&ssl=true&prepareThreshold=0"
  SPRING_DATASOURCE_USERNAME: "nsipadmin"
  
  # --- Azure Cache for Redis ---
  SPRING_DATA_REDIS_HOST: "nsip-redis-v4.redis.cache.windows.net"
  SPRING_DATA_REDIS_PORT: "6380"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
  SPRING_DATA_REDIS_CONNECT_TIMEOUT: "10000"
  SPRING_DATA_REDIS_TIMEOUT: "10000"
  
  # --- Kafka (Azure Event Hubs) ---
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "nsip-eventhubs-v4.servicebus.windows.net:9093"
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SASL_SSL"
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: "PLAIN"
  SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${EVENT_HUBS_CONNECTION_STRING}";'
  
  # --- Application Runtime ---
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
  LOGGING_LEVEL_ROOT: "INFO"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
  SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -Xss256k -Dspring.main.lazy-initialization=true -Dspring.jpa.open-in-view=false"
---
