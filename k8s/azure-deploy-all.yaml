apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nsip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nsipregistryv4.azurecr.io/api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nsip-azure-config
            - secretRef:
                name: nsip-azure-secrets
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 300m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 45
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 90
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nsip
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
---
