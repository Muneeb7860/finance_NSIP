# --- AI Agent ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: nsip
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
        - name: ai-agent
          image: nsipregistryv4.azurecr.io/ai-agent:latest
          ports:
            - containerPort: 8091
              name: health
          envFrom:
            - configMapRef:
                name: nsip-azure-config
            - secretRef:
                name: nsip-azure-secrets
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 400m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8091 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8091 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: nsip
spec:
  selector:
    app: ai-agent
  ports:
    - port: 8091
      targetPort: 8091
---
# ── Horizontal Pod Autoscaler: API Gateway ────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: nsip
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ── Horizontal Pod Autoscaler: Auth Service ───────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: nsip
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
