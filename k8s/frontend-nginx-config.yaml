apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: nsip
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        error_page 404 /index.html;
    }
