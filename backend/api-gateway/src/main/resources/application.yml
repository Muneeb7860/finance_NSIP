server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        
        - id: claim-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/claims/**
        
        - id: contribution-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/contributions/**
        
        - id: education-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/learning/**
        
        - id: event-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/events/**
        
        - id: rewards-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/rewards/**
        
        - id: payment-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/payments/**
        
        - id: review-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/reviews/**
        
        - id: notification-engine
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/notifications/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
