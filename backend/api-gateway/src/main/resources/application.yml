server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: globalCircuitBreaker
            fallbackUri: forward:/fallback
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 1000ms
              factor: 2

      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
        
        - id: claim-service
          uri: http://claim-service:8082
          predicates:
            - Path=/api/v1/claims/**
        
        - id: contribution-service
          uri: http://contribution-service:8083
          predicates:
            - Path=/api/v1/contributions/**
        
        - id: education-service
          uri: http://education-service:8084
          predicates:
            - Path=/api/v1/learning/**
        
        - id: event-service
          uri: http://event-service:8085
          predicates:
            - Path=/api/v1/events/**
        
        - id: rewards-service
          uri: http://rewards-service:8086
          predicates:
            - Path=/api/v1/rewards/**
        
        - id: payment-service
          uri: http://payment-service:8088
          predicates:
            - Path=/api/v1/payments/**
        
        - id: review-service
          uri: http://review-service:8089
          predicates:
            - Path=/api/v1/reviews/**
        
        - id: notification-engine
          uri: http://notification-engine:8090
          predicates:
            - Path=/api/v1/notifications/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "https://nsip-web.azurewebsites.net"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

resilience4j:
  circuitbreaker:
    instances:
      globalCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always

# ============================================================
# API DOCUMENTATION
# ============================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api/v1/auth/v3/api-docs
      - name: Claim Service
        url: /api/v1/claims/v3/api-docs
      - name: Contribution Service
        url: /api/v1/contributions/v3/api-docs
      - name: Event Service
        url: /api/v1/events/v3/api-docs
