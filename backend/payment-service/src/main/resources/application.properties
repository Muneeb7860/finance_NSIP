spring.application.name=payment-service
server.port=8088

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nsip_payments}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nsip_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nsip_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.paymentGateway.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentGateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentGateway.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.paymentGateway.permittedNumberOfCallsInHalfOpenState=3

# Resilience4j Retry
resilience4j.retry.instances.paymentGateway.maxAttempts=3
resilience4j.retry.instances.paymentGateway.waitDuration=500ms
resilience4j.retry.instances.paymentGateway.enableExponentialBackoff=true
resilience4j.retry.instances.paymentGateway.exponentialBackoffMultiplier=2
