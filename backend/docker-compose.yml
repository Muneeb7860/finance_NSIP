version: '3.8'

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:14-alpine
    container_name: nsip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nsip_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - nsip-network

  redis:
    image: redis:7-alpine
    container_name: nsip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nsip-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: nsip-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://nsip-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - nsip-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: nsip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - nsip-network

  # ============================================================
  # API GATEWAY (Hardened)
  # ============================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: nsip-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_REDIS_HOST: redis
    depends_on:
      - redis
    networks:
      - nsip-network

  # ============================================================
  # CORE SERVICES
  # ============================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: nsip-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_auth
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nsip-kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  claim-service:
    build:
      context: ./claim-service
      dockerfile: Dockerfile
    container_name: nsip-claim
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_claims
      SPRING_DATASOURCE_USERNAME: claim_user
      SPRING_DATASOURCE_PASSWORD: claim_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nsip-kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  contribution-service:
    build:
      context: ./contribution-service
      dockerfile: Dockerfile
    container_name: nsip-contribution
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_contributions
      SPRING_DATASOURCE_USERNAME: contribution_user
      SPRING_DATASOURCE_PASSWORD: contribution_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nsip-kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  education-service:
    build:
      context: ./education-service
      dockerfile: Dockerfile
    container_name: nsip-education
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_education
      SPRING_DATASOURCE_USERNAME: education_user
      SPRING_DATASOURCE_PASSWORD: education_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nsip-kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  event-service:
    build:
      context: ./event-service
      dockerfile: Dockerfile
    container_name: nsip-event
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_events
      SPRING_DATASOURCE_USERNAME: event_user
      SPRING_DATASOURCE_PASSWORD: event_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nsip-kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  notification-engine:
    build:
      context: ./notification-engine
      dockerfile: Dockerfile
    container_name: nsip-notification
    ports:
      - "8090:8090"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nsip-kafka:29092
    depends_on:
      - kafka
    networks:
      - nsip-network

  # ============================================================
  # SECURITY GUARDRAILS: IMMUTABLE BACKUPS
  # ============================================================
  db-backup:
    image: prodrigestivill/postgres-backup-local:14-alpine
    container_name: nsip-db-backup
    restart: always
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_CLUSTER=true
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nsip_db
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    depends_on:
      - postgres
    networks:
      - nsip-network

volumes:
  postgres_data:
  redis_data:
  backup_data: # Immutable backup volume

networks:
  nsip-network:
    driver: bridge
