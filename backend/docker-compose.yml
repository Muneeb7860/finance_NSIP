version: '3.8'

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:14-alpine
    container_name: nsip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nsip_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - nsip-network

  redis:
    image: redis:7-alpine
    container_name: nsip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nsip-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: nsip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - nsip-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: nsip-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - nsip-network

  # ============================================================
  # CORE MICROSERVICES
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: nsip-auth
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_auth
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - kafka
      - redis
    networks:
      - nsip-network

  claim-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: claim-service
    container_name: nsip-claim
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_claims
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  contribution-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: contribution-service
    container_name: nsip-contribution
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_contributions
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  # ============================================================
  # EDUCATION & GAMIFICATION SERVICES
  # ============================================================
  education-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: education-service
    container_name: nsip-education
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_education
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  event-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: event-service
    container_name: nsip-event
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_events
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  rewards-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rewards-service
    container_name: nsip-rewards
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_rewards
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  # ============================================================
  # DISTRIBUTED ARCHITECTURE SERVICES
  # ============================================================
  saga-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: saga-orchestrator
    container_name: nsip-saga
    ports:
      - "8087:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_saga
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    container_name: nsip-payment
    ports:
      - "8088:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_payments
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  review-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: review-service
    container_name: nsip-review
    ports:
      - "8089:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nsip_reviews
      SPRING_DATASOURCE_USERNAME: nsip_user
      SPRING_DATASOURCE_PASSWORD: nsip_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - nsip-network

  notification-engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-engine
    container_name: nsip-notification
    ports:
      - "8090:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SMTP_USER}
      SPRING_MAIL_PASSWORD: ${SMTP_PASS}
    depends_on:
      - kafka
    networks:
      - nsip-network

  # ============================================================
  # DAPR SIDECARS (Reducing Boilerplate)
  # ============================================================
  auth-dapr:
    image: "daprio/daprd:latest"
    command: ["./daprd", "-app-id", "auth-service", "-app-port", "8080", "-dapr-http-port", "3500"]
    depends_on: [auth-service]
    network_mode: "service:auth-service"

  claim-dapr:
    image: "daprio/daprd:latest"
    command: ["./daprd", "-app-id", "claim-service", "-app-port", "8080", "-dapr-http-port", "3500"]
    depends_on: [claim-service]
    network_mode: "service:claim-service"

  # ============================================================
  # MONITORING & OBSERVABILITY (Service Mesh Baseline)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: nsip-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - nsip-network

  grafana:
    image: grafana/grafana:latest
    container_name: nsip-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - nsip-network

volumes:
  postgres_data:
  redis_data:

networks:
  nsip-network:
    driver: bridge
