name: Deploy NSIP to Azure (Optimized)

on:
  push:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: true
          tags: nsipregistryv4.azurecr.io/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          "api-gateway",
          "auth-service",
          "claim-service",
          "contribution-service",
          "education-service",
          "event-service",
          "notification-engine",
          "payment-service",
          "review-service",
          "rewards-service",
          "saga-orchestrator"
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: nsipregistryv4.azurecr.io/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ai-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AI Agent
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ai-agent
          push: true
          tags: nsipregistryv4.azurecr.io/ai-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-ai-agent]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: nsip-prod-rg-v4
          cluster-name: nsip-aks-cluster

      - name: Deploy to AKS
        run: |
          kubectl apply -f ./k8s/namespace.yaml
          kubectl apply -f ./k8s/azure-config.yaml
          kubectl apply -f ./k8s/azure-deploy-all.yaml
          kubectl apply -f ./k8s/ingress.yaml

      - name: Verify Deployment Health
        run: |
          echo "🕒 Waiting for deployments to stabilize..."
          DEPLOYMENTS=$(kubectl get deployments -n nsip -o name)
          for deploy in $DEPLOYMENTS; do
            kubectl rollout status $deploy -n nsip --timeout=120s
          done
          echo "✅ All services are healthy!"
