name: Deploy NSIP to Azure (Parallel)

on:
  push:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Frontend
        run: |
          az acr login --name nsipregistryv4
          docker build -t nsipregistryv4.azurecr.io/frontend:latest ./frontend-web
          docker push nsipregistryv4.azurecr.io/frontend:latest

  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          "api-gateway",
          "auth-service",
          "claim-service",
          "contribution-service",
          "education-service",
          "event-service",
          "notification-engine",
          "payment-service",
          "review-service",
          "rewards-service",
          "saga-orchestrator"
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and push Backend Service
        run: |
          az acr login --name nsipregistryv4
          docker build -t nsipregistryv4.azurecr.io/${{ matrix.service }}:latest --build-arg SERVICE_NAME=${{ matrix.service }} ./backend
          docker push nsipregistryv4.azurecr.io/${{ matrix.service }}:latest

  build-ai-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push AI Agent
        run: |
          az acr login --name nsipregistryv4
          docker build -t nsipregistryv4.azurecr.io/ai-agent:latest ./backend/ai-agent
          docker push nsipregistryv4.azurecr.io/ai-agent:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-ai-agent]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: nsip-prod-rg-v4
          cluster-name: nsip-aks-cluster

      - name: Deploy to AKS
        run: |
          kubectl apply -f ./k8s/namespace.yaml
          kubectl apply -f ./k8s/azure-config.yaml
          kubectl apply -f ./k8s/azure-deploy-all.yaml
          kubectl apply -f ./k8s/ingress.yaml
